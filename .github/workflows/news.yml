
name: Refresh economy news
on:
  schedule:
    - cron: '15 22 * * *'
    - cron: '15 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: econ-bite-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_news.py
      - run: python generate_daily.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: github.event_name != 'push'
      - name: Save data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json daily.json
          git diff --cached --quiet || (git commit -m 'Refresh learning content' && git push)
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p site
          cp index.html lessons.js manifest.webmanifest icon-192.png icon-512.png sw.js news.json daily.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
